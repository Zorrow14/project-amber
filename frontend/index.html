<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amber: Myanmar's development since 2011, a synthetic no-coup counterfactual, and scenarios to 2035."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="%AMBER_SITE_URL%/" />
    <!--
      The share card. Its description is the opening of config.PROJECT_FRAMING,
      word for word (tests/test_share_card.py checks it). The image is the static
      public/og-image.png, regenerated with `npm run smoke -- --og public/og-image.png`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amber" />
    <meta property="og:title" content="Amber · Myanmar development simulation" />
    <meta
      property="og:description"
      content="Amber is an analytical instrument, not an argument. It treats the February 2021 coup as a documented event with measurable consequences and takes no partisan stance."
    />
    <meta property="og:url" content="%AMBER_SITE_URL%/" />
    <meta property="og:image" content="%AMBER_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Amber's chart of real GDP per capita for Myanmar and six regional peers, 2011 to 2024, under the headline Two timelines, side by side."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="my_MM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amber · Myanmar development simulation" />

      name="twitter:description"
      content="Amber is an analytical instrument, not an argument. It treats the February 2021 coup as a documented event with measurable consequences and takes no partisan stance."
    />
    <meta name="twitter:image" content="%AMBER_SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Amber's chart of real GDP per capita for Myanmar and six regional peers, 2011 to 2024, under the headline Two timelines, side by side."
    />
    <title>Amber · Myanmar development simulation</title>
  </head>
