# Render Blueprint for the Amber API. The API serves the committed data/release
# snapshot, so neither the build nor the service ever calls the World Bank API.
# Step-by-step deploy: DEPLOY.md.
#
# The free plan sleeps after ~15 minutes idle and takes up to a minute to wake;
# the frontend shows a "waking the server" state meanwhile and retries.
services:
  - type: web
    name: amber-api
    runtime: python
    plan: free
    # Editable install: config resolves data/ relative to the source tree.
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn amber.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AMBER_DATA_SOURCE
        value: release
      - key: AMBER_LOG_LEVEL
        value: INFO
      # The Vercel URL(s), comma-separated - set in the dashboard after the
      # frontend's first deploy, e.g. https://amber.vercel.app
      - key: AMBER_CORS_ORIGINS
        sync: false
